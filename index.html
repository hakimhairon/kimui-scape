
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>KimUI-Scape · Design System v2.0</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#f5f6fa;--surface:#fff;--text:#1a1d2e;--text2:#64748b;--muted:#94a3b8;--border:#eef0f6;--accent:#6366f1;--accent-soft:rgba(99,102,241,.08);--green:#10b981;--amber:#f59e0b;--red:#ef4444;--pink:#f43f7a;--purple:#8b5cf6;--blue:#3b82f6;--radius:16px;--shadow:0 4px 16px rgba(0,0,0,.06);--font:'Plus Jakarta Sans',sans-serif;--font-alt:'Inter',sans-serif;--font-mono:'Fira Code',monospace}
html{font-size:15px}
body{font-family:var(--font);background:#0f0f14;display:flex;min-height:100vh;color:var(--text);-webkit-font-smoothing:antialiased}

.sidebar{width:260px;background:#000;display:flex;flex-direction:column;position:fixed;top:0;left:0;bottom:0;overflow-y:auto;scrollbar-width:none;transition:transform .3s cubic-bezier(.4,0,.2,1);z-index:100}
.sidebar::-webkit-scrollbar{display:none}
.sidebar.closed{transform:translateX(-260px)}
.sb-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:99}
.sb-overlay.open{display:block}

main{flex:1;margin-left:275px;background:var(--bg);min-height:calc(100vh - 30px);padding:40px 48px;margin-top:15px;margin-right:15px;margin-bottom:15px;border-radius:30px;transition:margin .3s cubic-bezier(.4,0,.2,1)}
.sidebar.closed~.sb-overlay~main{margin-left:15px}

@media(max-width:768px){
.sidebar{transform:translateX(-260px)}
.sidebar.open{transform:translateX(0)}
.sb-overlay.open{display:block}
main{margin-left:15px!important;padding:24px 20px}
}

.sb-brand{padding:24px;display:flex;align-items:center;gap:12px;font-size:1.15rem;font-weight:800;color:#fff;letter-spacing:-.3px}
.sb-brand i{font-size:1.3rem;color:#f97316;background:rgba(249,115,22,.15);width:40px;height:40px;display:flex;align-items:center;justify-content:center;border-radius:12px}
.sb-footer{padding:20px 24px;font-size:.7rem;color:rgba(255,255,255,.2);margin-top:auto}
.sb-section{padding:20px 24px 6px;font-size:.65rem;text-transform:uppercase;letter-spacing:1.2px;color:rgba(255,255,255,.25);font-weight:700}
.sb-item{display:flex;align-items:center;gap:10px;padding:9px 24px;color:rgba(255,255,255,.5);font-size:.88rem;font-weight:500;cursor:pointer;transition:.15s;border-left:3px solid transparent}
.sb-item:hover{color:#fff;background:rgba(255,255,255,.04)}
.sb-item.active{color:#fff;background:rgba(255,255,255,.08);border-left-color:#f97316}
.sb-item i{width:18px;text-align:center;font-size:.85rem}

.sb-toggle{background:none;border:1px solid var(--border);border-radius:10px;width:40px;height:40px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:1rem;color:var(--text);margin-bottom:20px;transition:.15s;flex-shrink:0}
.sb-toggle:hover{background:var(--accent-soft);color:var(--accent);border-color:var(--accent)}

.sec{margin-bottom:48px}
.sec-title{font-size:1.8rem;font-weight:800;letter-spacing:-.5px;margin-bottom:6px}
.sec-desc{color:var(--text2);font-size:1rem;line-height:1.7;margin-bottom:28px;max-width:700px}
.sec-sub{font-size:1.1rem;font-weight:700;margin:24px 0 12px;display:flex;align-items:center;gap:8px}
.sec-sub i{color:var(--accent);font-size:.9rem}

.demo{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:28px;margin-bottom:16px}
.demo-row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.demo-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.demo-label{font-size:.75rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:10px}

.code{background:#1e1e2e;color:#cdd6f4;border-radius:12px;padding:16px 20px;font-family:var(--font-mono);font-size:.82rem;line-height:1.7;overflow-x:auto;margin-bottom:16px}
.code .kw{color:#cba6f7}.code .str{color:#a6e3a1}.code .cm{color:#585b70}.code .fn{color:#89b4fa}.code .num{color:#fab387}.code .tag{color:#f38ba8}.code .attr{color:#f9e2af}

.token-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.token{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:16px;text-align:center}
.token-swatch{width:48px;height:48px;border-radius:12px;margin:0 auto 10px;box-shadow:0 2px 8px rgba(0,0,0,.1)}
.token-name{font-size:.82rem;font-weight:700}
.token-val{font-size:.72rem;color:var(--muted);margin-top:2px}

.btn-demo{display:inline-flex;align-items:center;gap:8px;padding:10px 20px;border:none;border-radius:10px;font-size:.88rem;font-weight:700;font-family:var(--font);cursor:pointer;transition:.2s}
.btn-demo:active{transform:scale(.97)}
.btn-primary-d{background:var(--accent);color:#fff;box-shadow:0 2px 8px rgba(99,102,241,.25)}
.btn-primary-d:hover{filter:brightness(1.1);transform:translateY(-1px)}
.btn-outline-d{background:transparent;border:1.5px solid var(--border);color:var(--text)}
.btn-outline-d:hover{border-color:var(--accent);color:var(--accent)}
.btn-danger-d{background:var(--red);color:#fff}
.btn-success-d{background:var(--green);color:#fff}
.btn-ghost-d{background:transparent;color:var(--text2)}
.btn-ghost-d:hover{background:var(--accent-soft);color:var(--accent)}
.btn-sm-d{padding:7px 14px;font-size:.8rem}
.btn-lg-d{padding:14px 28px;font-size:1rem}

.input-demo{padding:12px 16px;border:1.5px solid var(--border);border-radius:10px;font-size:.92rem;font-family:var(--font);background:var(--surface);color:var(--text);width:100%;max-width:320px;transition:.2s}
.input-demo:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
.input-demo::placeholder{color:var(--muted)}

.card-demo{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:24px;transition:.25s}
.card-demo:hover{box-shadow:var(--shadow);transform:translateY(-2px)}
.card-demo-title{font-size:1rem;font-weight:700;margin-bottom:6px}
.card-demo-desc{font-size:.85rem;color:var(--text2);line-height:1.5}

.badge-d{display:inline-flex;padding:4px 12px;border-radius:20px;font-size:.72rem;font-weight:700}
.badge-green{background:rgba(16,185,129,.1);color:var(--green)}
.badge-amber{background:rgba(245,158,11,.1);color:var(--amber)}
.badge-red{background:rgba(239,68,68,.1);color:var(--red)}
.badge-blue{background:rgba(59,130,246,.1);color:var(--blue)}
.badge-purple{background:rgba(139,92,246,.1);color:var(--purple)}

.toast-demo{display:inline-flex;align-items:center;gap:10px;background:var(--surface);border-radius:14px;padding:14px 22px;box-shadow:0 8px 30px rgba(0,0,0,.12);font-weight:600;font-size:.9rem}
.toast-icon-d{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center}

.stat-demo{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:22px;position:relative;overflow:hidden}
.stat-demo::before{content:'';position:absolute;top:0;left:0;right:0;height:3px}
.stat-demo.s-pink::before{background:linear-gradient(90deg,#f43f7a,#ff6b9d)}
.stat-demo.s-green::before{background:linear-gradient(90deg,#10b981,#34d399)}
.stat-demo.s-blue::before{background:linear-gradient(90deg,#3b82f6,#60a5fa)}
.stat-demo.s-purple::before{background:linear-gradient(90deg,#8b5cf6,#a78bfa)}
.stat-demo .s-val{font-size:1.6rem;font-weight:800;letter-spacing:-.5px}
.stat-demo .s-label{font-size:.78rem;color:var(--text2);margin-top:2px}

.popup-demo{background:var(--surface);border-radius:20px;padding:28px;box-shadow:0 20px 60px rgba(0,0,0,.15);max-width:360px;width:100%}
.popup-demo h3{font-size:1.05rem;font-weight:700;margin-bottom:16px}

table.tbl-demo{width:100%;border-collapse:separate;border-spacing:0}
.tbl-demo th{text-align:left;padding:10px 14px;font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.8px;color:var(--muted);background:var(--bg)}
.tbl-demo td{padding:12px 14px;font-size:.88rem;border-bottom:1px solid var(--border)}
.tbl-demo tr:hover td{background:rgba(99,102,241,.02)}

.picker-demo{background:var(--surface);border-radius:20px;width:260px;overflow:hidden;box-shadow:var(--shadow)}
.picker-demo-header{display:flex;justify-content:space-between;padding:12px 16px;border-bottom:1px solid var(--border);font-size:.85rem;font-weight:700}
.picker-demo-header span:first-child,.picker-demo-header span:last-child{color:var(--accent);cursor:pointer}
.picker-demo-body{height:160px;position:relative;overflow:hidden}
.picker-demo-hl{position:absolute;top:50%;left:12px;right:12px;height:36px;transform:translateY(-50%);border-top:1.5px solid var(--border);border-bottom:1.5px solid var(--border)}
.picker-demo-item{height:36px;display:flex;align-items:center;justify-content:center;font-size:.95rem;font-weight:600;color:var(--muted)}
.picker-demo-item.sel{color:var(--text);font-weight:700}

.tl-demo{position:relative;padding-left:20px}
.tl-demo::before{content:'';position:absolute;left:7px;top:8px;bottom:8px;width:2px;background:var(--border)}
.tl-demo-item{position:relative;display:flex;gap:12px;margin-bottom:12px}
.tl-demo-dot{position:absolute;left:-17px;top:8px;width:10px;height:10px;border-radius:50%}
.tl-demo-card{flex:1;background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:10px 14px;font-size:.85rem}

.sidebar-demo{border-radius:16px;padding:20px;width:240px;color:#a5b4fc}
.sd-item{padding:9px 14px;border-radius:10px;font-size:.85rem;font-weight:500;margin-bottom:2px;cursor:pointer;display:flex;align-items:center;gap:10px;transition:.15s}
.sd-item:hover{background:rgba(255,255,255,.06);color:#fff}
.sd-item.active{background:rgba(255,255,255,.1);color:#fff}
.sd-item i{width:18px;text-align:center;font-size:.85rem}
.sd-sub{max-height:0;overflow:hidden;transition:max-height .2s}
.sd-sub.open{max-height:200px}
.sd-item.open .fa-chevron-down{transform:rotate(180deg)}

.shimmer-fx{position:absolute;top:-50%;left:-50%;width:200%;height:200%;background:linear-gradient(45deg,transparent,rgba(255,255,255,.15),transparent);transform:rotate(45deg);animation:shimmerFx 5s infinite}
@keyframes shimmerFx{0%{transform:translateX(-150%) rotate(45deg)}100%{transform:translateX(150%) rotate(45deg)}}
</style>
</head>
<body>
<aside class="sidebar" id="sidebar">
<div class="sb-brand"><i class="fas fa-satellite"></i> KimUI-Scape</div>
<div id="sideNav"></div>
<div class="sb-footer">Design System v2.0<br>Galactic Network</div>
</aside>
<div class="sb-overlay" id="sbOverlay" onclick="toggleSidebar()"></div>
<main>
<button class="sb-toggle" onclick="toggleSidebar()"><i class="fas fa-bars"></i></button>
<div id="content"></div>
</main>
<script>
const SECTIONS = [
{id:'overview',icon:'fa-house',label:'Overview'},
{section:'Foundation'},
{id:'colors',icon:'fa-palette',label:'Colors'},
{id:'typography',icon:'fa-font',label:'Typography'},
{id:'spacing',icon:'fa-ruler',label:'Spacing & Radius'},
{section:'Components'},
{id:'buttons',icon:'fa-hand-pointer',label:'Buttons'},
{id:'inputs',icon:'fa-keyboard',label:'Inputs'},
{id:'cards',icon:'fa-square',label:'Cards'},
{id:'badges',icon:'fa-tag',label:'Badges'},
{id:'tables',icon:'fa-table',label:'Tables'},
{section:'Patterns'},
{id:'login',icon:'fa-lock',label:'Login Page'},
{id:'sidebar',icon:'fa-bars',label:'Sidebar Navigation'},
{id:'stats',icon:'fa-chart-bar',label:'Stat Cards'},
{id:'toasts',icon:'fa-bell',label:'Toast Notifications'},
{id:'modals',icon:'fa-window-restore',label:'Modals & Popups'},
{id:'picker',icon:'fa-list-ol',label:'Scroll Picker'},
{id:'timeline',icon:'fa-clock',label:'Timeline'},
{id:'icons',icon:'fa-icons',label:'Icons'},
{id:'animations',icon:'fa-wand-magic-sparkles',label:'Animations'},
];

function buildNav(){document.getElementById('sideNav').innerHTML=SECTIONS.map(s=>s.section?`<div class="sb-section">${s.section}</div>`:`<div class="sb-item" data-id="${s.id}" onclick="go('${s.id}')"><i class="fas ${s.icon}"></i>${s.label}</div>`).join('')}
function go(id){document.querySelectorAll('.sb-item').forEach(n=>n.classList.toggle('active',n.dataset.id===id));const fn=renders[id];if(fn)document.getElementById('content').innerHTML=fn();if(window.innerWidth<=768)toggleSidebar()}
function toggleSidebar(){const sb=document.getElementById('sidebar');const ov=document.getElementById('sbOverlay');if(window.innerWidth<=768){sb.classList.toggle('open');ov.classList.toggle('open')}else{sb.classList.toggle('closed')}}

const renders={};
renders.overview=()=>`<div class="sec">
<h1 class="sec-title">KimUI-Scape</h1>
<p class="sec-desc">A comprehensive design system for Galactic Network tools. Documents every UI pattern, component, token, and interaction — your single source of truth for consistent interfaces.</p>
<div class="sec-sub"><i class="fas fa-layer-group"></i> Design Principles</div>
<div class="demo"><div class="demo-grid">
<div class="card-demo"><div class="card-demo-title"><i class="fas fa-circle" style="color:var(--green);margin-right:6px;font-size:.6rem"></i>Clean & Modern</div><div class="card-demo-desc">Rounded corners, soft shadows, generous whitespace.</div></div>
<div class="card-demo"><div class="card-demo-title"><i class="fas fa-circle" style="color:#f97316;margin-right:6px;font-size:.6rem"></i>Vibrant Accents</div><div class="card-demo-desc">Gradient icons and semantic color coding.</div></div>
<div class="card-demo"><div class="card-demo-title"><i class="fas fa-circle" style="color:var(--blue);margin-right:6px;font-size:.6rem"></i>Consistent Spacing</div><div class="card-demo-desc">8px grid system with padding in multiples of 4.</div></div>
<div class="card-demo"><div class="card-demo-title"><i class="fas fa-circle" style="color:var(--purple);margin-right:6px;font-size:.6rem"></i>Purposeful Motion</div><div class="card-demo-desc">Hover lifts, focus rings, active scale.</div></div>
</div></div>
<div class="sec-sub"><i class="fas fa-compass"></i> What's Inside</div>
<div class="demo"><div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px">
${[{i:'fa-palette',c:'#f43f7a',t:'Colors',n:'colors'},{i:'fa-font',c:'#8b5cf6',t:'Typography',n:'typography'},{i:'fa-ruler',c:'#f59e0b',t:'Spacing',n:'spacing'},{i:'fa-hand-pointer',c:'#10b981',t:'Buttons',n:'buttons'},{i:'fa-keyboard',c:'#3b82f6',t:'Inputs',n:'inputs'},{i:'fa-square',c:'#f97316',t:'Cards',n:'cards'},{i:'fa-tag',c:'#6366f1',t:'Badges',n:'badges'},{i:'fa-table',c:'#0ea5e9',t:'Tables',n:'tables'},{i:'fa-lock',c:'#ec4899',t:'Login',n:'login'},{i:'fa-bars',c:'#14b8a6',t:'Sidebar',n:'sidebar'},{i:'fa-chart-bar',c:'#ef4444',t:'Stats',n:'stats'},{i:'fa-bell',c:'#f97316',t:'Toasts',n:'toasts'},{i:'fa-window-restore',c:'#8b5cf6',t:'Modals',n:'modals'},{i:'fa-list-ol',c:'#3b82f6',t:'Picker',n:'picker'},{i:'fa-clock',c:'#10b981',t:'Timeline',n:'timeline'},{i:'fa-wand-magic-sparkles',c:'#f43f7a',t:'Animations',n:'animations'}].map(c=>`<div style="background:#fff;border:1px solid var(--border);border-radius:16px;padding:20px;cursor:pointer;transition:.25s;position:relative;overflow:hidden" onclick="go('${c.n}')" onmouseover="this.style.transform='translateY(-3px)';this.style.boxShadow='0 12px 32px rgba(0,0,0,.08)'" onmouseout="this.style.transform='';this.style.boxShadow=''"><div style="position:absolute;top:-30px;right:-30px;width:100px;height:100px;background:${c.c};opacity:.06;border-radius:50%;filter:blur(25px)"></div><div style="width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,${c.c},${c.c}dd);display:flex;align-items:center;justify-content:center;color:#fff;font-size:.95rem;margin-bottom:12px"><i class="fas ${c.i}"></i></div><div style="font-weight:700;font-size:.92rem">${c.t}</div></div>`).join('')}
</div></div></div>`;

renders.colors=()=>`<div class="sec">
<h1 class="sec-title">Colors</h1>
<p class="sec-desc">Semantic color tokens with base and soft variants.</p>
<div class="sec-sub"><i class="fas fa-circle-half-stroke"></i> Primary Palette</div>
<div class="demo"><div class="token-grid">
${[['#6366f1','Indigo'],['#818cf8','Indigo Light'],['#f97316','Orange'],['#fb923c','Orange Light'],['#10b981','Green'],['#34d399','Green Light'],['#f59e0b','Amber'],['#fbbf24','Amber Light'],['#ef4444','Red'],['#f87171','Red Light'],['#8b5cf6','Purple'],['#a78bfa','Purple Light'],['#3b82f6','Blue'],['#60a5fa','Blue Light'],['#f43f7a','Pink'],['#0ea5e9','Cyan'],['#14b8a6','Teal'],['#ec4899','Rose']].map(([v,n])=>`<div class="token"><div class="token-swatch" style="background:${v}"></div><div class="token-name">${n}</div><div class="token-val">${v}</div></div>`).join('')}
</div></div>
<div class="sec-sub"><i class="fas fa-moon"></i> Surfaces & Neutrals</div>
<div class="demo"><div class="token-grid">
${[['#f3f5f9','Background'],['#ffffff','Surface'],['#eef0f6','Border'],['#1a1d2e','Text'],['#64748b','Muted'],['#000000','Sidebar'],['#020617','Deep Space']].map(([v,n])=>`<div class="token"><div class="token-swatch" style="background:${v}${v==='#ffffff'?';border:1px solid #eee':''}"></div><div class="token-name">${n}</div><div class="token-val">${v}</div></div>`).join('')}
</div></div></div>`;
renders.typography=()=>`<div class="sec">
<h1 class="sec-title">Typography</h1>
<p class="sec-desc">Two font families for headings/UI and monospace content.</p>
<div class="sec-sub"><i class="fas fa-text-height"></i> Font Families</div>
<div class="demo">
<div style="font-size:1.4rem;font-weight:800;margin-bottom:8px">Plus Jakarta Sans (Primary)</div>
<div style="color:var(--text2);margin-bottom:20px">Headings, labels, buttons, body. Weights: 400–800.</div>
<div style="font-family:var(--font-mono);font-size:1rem;margin-bottom:8px">Fira Code (Monospace)</div>
<div style="font-family:var(--font-mono);color:var(--text2)">Code blocks, terminal output, technical values.</div>
</div>
<div class="sec-sub"><i class="fas fa-heading"></i> Scale</div>
<div class="demo">
<div style="font-size:2.8rem;font-weight:800;letter-spacing:-1px;margin-bottom:8px">Hero (2.8rem)</div>
<div style="font-size:1.5rem;font-weight:800;margin-bottom:8px">Page Title (1.5rem)</div>
<div style="font-size:1.2rem;font-weight:700;margin-bottom:8px">Section (1.2rem)</div>
<div style="font-size:1.1rem;font-weight:700;margin-bottom:8px">Card Title (1.1rem)</div>
<div style="font-size:.95rem;font-weight:600;margin-bottom:8px">Label (0.95rem)</div>
<div style="font-size:.88rem;margin-bottom:8px">Body (0.88rem)</div>
<div style="font-size:.78rem;color:var(--text2)">Caption (0.78rem)</div>
</div></div>`;

renders.spacing=()=>`<div class="sec">
<h1 class="sec-title">Spacing & Radius</h1>
<p class="sec-desc">4px increments for spacing. Radius tokens for different component sizes.</p>
<div class="sec-sub"><i class="fas fa-ruler-combined"></i> Spacing Scale</div>
<div class="demo"><div style="display:flex;flex-wrap:wrap;gap:16px;align-items:flex-end">
${[4,8,12,16,20,24,32,40,48].map(s=>`<div style="text-align:center"><div style="width:${s}px;height:${s}px;background:var(--accent);border-radius:4px;margin:0 auto 6px"></div><div style="font-size:.72rem;font-weight:700;color:var(--muted)">${s}px</div></div>`).join('')}
</div></div>
<div class="sec-sub"><i class="fas fa-circle"></i> Border Radius</div>
<div class="demo"><div style="display:flex;gap:20px;flex-wrap:wrap">
${[{r:8,l:'xs'},{r:12,l:'sm'},{r:16,l:'md'},{r:20,l:'lg'},{r:30,l:'xl'},{r:9999,l:'full'}].map(v=>`<div style="text-align:center"><div style="width:64px;height:64px;background:rgba(249,115,22,.1);border:2px solid #f97316;border-radius:${v.r}px;margin:0 auto 8px"></div><div style="font-size:.78rem;font-weight:700">${v.l}</div><div style="font-size:.7rem;color:var(--muted)">${v.r}px</div></div>`).join('')}
</div></div>
<div class="sec-sub"><i class="fas fa-layer-group"></i> Shadows</div>
<div class="demo"><div style="display:flex;gap:24px;flex-wrap:wrap">
<div style="width:120px;height:80px;background:#fff;border-radius:12px;box-shadow:0 4px 20px rgba(0,0,0,.03);display:flex;align-items:center;justify-content:center;font-size:.75rem;font-weight:600;color:var(--muted)">soft</div>
<div style="width:120px;height:80px;background:#fff;border-radius:12px;box-shadow:0 4px 16px rgba(0,0,0,.06);display:flex;align-items:center;justify-content:center;font-size:.75rem;font-weight:600;color:var(--muted)">medium</div>
